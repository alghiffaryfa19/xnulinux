# SPDX-License-Identifier: GPL-2.0-only
# Build XnuCpuMetal.bundle (arm64 + arm64e universal), the macOS 27 APFS system disk (mac.img),
# mac.conf (ROOT_UUID, BOOT_UUID), and trustcache-mac.bin on a macos-26 runner, plus optional
# Linux arm64 kernel/kc.bin build, and publish split zstd assets to a GitHub Release.
name: build-xnulinux

on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "macOS runner for building XnuCpuMetal.bundle and mac.img (macos-26 has Xcode 26 and macOS 26/27 APFS tools)"
        type: choice
        options: ["macos-26", "macos-15", "macos-latest"]
        default: "macos-26"
      build_disk:
        description: "Build the full macOS 27.2 (26B8125) APFS system disk (mac.img) + trustcache-mac.bin + mac.conf"
        type: boolean
        default: true
      build_gpu_bundle:
        description: "Build universal (arm64 + arm64e) XnuCpuMetal.bundle (Turnip Adreno 740 + Lavapipe + Venus + metal2vulkan)"
        type: boolean
        default: true
      build_kernel:
        description: "Also build kernel.macho and kc.bin on ubuntu-24.04-arm"
        type: boolean
        default: false
      disk_size_gb:
        description: "Logical size of the mac.img APFS disk in GB (sparse)"
        type: string
        default: "36"
      publish_release:
        description: "Publish built artifacts (including split mac.img.zst.part-*) to GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-xnulinux-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  IPSW_URL: "https://updates.cdn-apple.com/2026FallFCS/b83bb963-ebd8-4608-8b5d-fdc70cb24927/UniversalMac_27.2_26B8125_Restore.ipsw"

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  macos-disk-and-gpu:
    if: ${{ inputs.build_disk || inputs.build_gpu_bundle }}
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 360
    steps:
      - name: Free disk space on runner
        run: |
          df -h "$GITHUB_WORKSPACE"
          ACTIVE_DEV=$(xcode-select -p 2>/dev/null || true)
          ACTIVE_XCODE="${ACTIVE_DEV%%/Contents/Developer}"
          if [ ! -d "$ACTIVE_XCODE" ] || [[ "$ACTIVE_XCODE" != /Applications/Xcode*.app ]]; then
            ACTIVE_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$ACTIVE_XCODE" ]; then
              sudo xcode-select -s "$ACTIVE_XCODE/Contents/Developer"
            fi
          fi
          echo "Keeping active Xcode: $ACTIVE_XCODE"
          for app in /Applications/Xcode_*.app; do
            [ -e "$app" ] || continue
            if [ "$app" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$app" || true
            fi
          done
          rm -rf "$HOME/Library/Android" 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Restore LLVM arm64e cache
        id: llvm-cache
        if: ${{ inputs.build_gpu_bundle }}
        uses: actions/cache/restore@v4
        with:
          key: xnulinux-llvm-arm64e-v1-${{ runner.os }}-${{ hashFiles('gpu/xnu-cpu-metal/scripts/build-llvm-arm64e.sh') }}
          restore-keys: |
            xnulinux-llvm-arm64e-v1-${{ runner.os }}-
          path: |
            gpu/xnu-cpu-metal/build/llvm-arm64e-install

      - name: Restore GPU build cache
        id: gpu-cache
        if: ${{ inputs.build_gpu_bundle }}
        uses: actions/cache/restore@v4
        with:
          key: xnulinux-gpu-v2-${{ runner.os }}-${{ hashFiles('gpu/xnu-cpu-metal/scripts/**', 'gpu/xnu-cpu-metal/patches/**', 'gpu/turnip/**', 'gpu/xnu-drm/**') }}
          restore-keys: |
            xnulinux-gpu-v2-${{ runner.os }}-
            xnulinux-gpu-v1-${{ runner.os }}-
          path: |
            gpu/xnu-cpu-metal/dist

      - name: Install Homebrew tools and Rust nightly
        run: |
          brew_prefix=$(brew --prefix)
          if [ ! -e /opt/homebrew ] && [ "$brew_prefix" != "/opt/homebrew" ]; then
            sudo mkdir -p /opt
            sudo ln -s "$brew_prefix" /opt/homebrew
          fi
          brew tap blacktop/tap || true
          if [ "${{ steps.gpu-cache.outputs.cache-hit }}" = "true" ] && [ -d "gpu/xnu-cpu-metal/dist/XnuCpuMetal.bundle" ]; then
            echo "XnuCpuMetal.bundle restored from cache; installing only ipsw and zstd for disk creation"
            brew install zstd blacktop/tap/ipsw
          else
            brew install llvm lld llvm@22 lld@22 cmake ninja meson glslang shaderc spirv-tools bison pkgconf zstd python@3.13 blacktop/tap/ipsw
            if command -v rustup >/dev/null 2>&1; then
              rustup toolchain install nightly --component rust-src
              rustup default nightly
            else
              RUSTUP_INIT_SKIP_PATH_CHECK=yes curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --component rust-src
            fi
            export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:$PATH"
            rustup target add aarch64-apple-darwin || true
          fi
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/rustup/bin"
            echo "/opt/homebrew/opt/llvm@22/bin"
            echo "/opt/homebrew/opt/lld@22/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/bison/bin"
            echo "/opt/homebrew/bin"
          } >> "$GITHUB_PATH"
          xcodebuild -version || xcrun --show-sdk-path

      - name: Build universal XnuCpuMetal.bundle (arm64 + arm64e)
        if: ${{ inputs.build_gpu_bundle && steps.gpu-cache.outputs.cache-hit != 'true' }}
        run: |
          # 1. Build Turnip Adreno Darwin driver (libvulkan_freedreno.dylib) & Venus Darwin driver (libvulkan_virtio.dylib)
          bash gpu/turnip/build-darwin.sh
          export TURNIP_DYLIB="$HOME/w/turnip-darwin/out/lib/libvulkan_freedreno.dylib"
          bash gpu/venus/build-darwin.sh
          export VENUS_DYLIB="$HOME/w/venus-darwin/out/lib/libvulkan_virtio.dylib"

          # 2. Prepare Python venv with Meson, Mako, PyYAML for Mesa Lavapipe
          cd gpu/xnu-cpu-metal
          mkdir -p build
          if [ ! -x build/pyvenv/bin/meson ]; then
            /opt/homebrew/bin/python3.13 -m venv build/pyvenv
            build/pyvenv/bin/pip install -q meson ninja mako pyyaml packaging
          fi

          # 3. Fetch pinned upstream sources (metal2vulkan, Vulkan-Loader, llvm-project, AdrenoMetal, Mesa)
          bash scripts/fetch-sources.sh

          # 4. Build arm64e LLVM static libraries for llvmpipe JIT (cached across runs)
          if [ ! -x build/llvm-arm64e-install/bin/llvm-config ]; then
            bash scripts/build-llvm-arm64e.sh
          fi

          # 5. Build Vulkan Loader (arm64 + arm64e), Lavapipe (arm64 + arm64e), metal2vulkan bridge (arm64 + arm64e), and universal bundle
          bash scripts/build-vkloader-arm64e.sh
          bash scripts/build-lavapipe.sh
          bash scripts/build-lavapipe-arm64e.sh
          bash scripts/build-m2v.sh
          bash scripts/build-m2v-arm64e.sh
          bash scripts/build-bundle-universal.sh

      - name: Save LLVM arm64e cache
        if: ${{ inputs.build_gpu_bundle && always() && steps.llvm-cache.outputs.cache-hit != 'true' && hashFiles('gpu/xnu-cpu-metal/build/llvm-arm64e-install/bin/llvm-config') != '' }}
        uses: actions/cache/save@v4
        with:
          key: xnulinux-llvm-arm64e-v1-${{ runner.os }}-${{ hashFiles('gpu/xnu-cpu-metal/scripts/build-llvm-arm64e.sh') }}
          path: |
            gpu/xnu-cpu-metal/build/llvm-arm64e-install

      - name: Save GPU build cache
        if: ${{ inputs.build_gpu_bundle && steps.gpu-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: xnulinux-gpu-v2-${{ runner.os }}-${{ hashFiles('gpu/xnu-cpu-metal/scripts/**', 'gpu/xnu-cpu-metal/patches/**', 'gpu/turnip/**', 'gpu/xnu-drm/**') }}
          path: |
            gpu/xnu-cpu-metal/dist

      - name: Build macOS 27.2 APFS disk image (mac.img) from IPSW
        if: ${{ inputs.build_disk }}
        env:
          DISK_GB: ${{ inputs.disk_size_gb }}
        run: |
          WORK="$RUNNER_TEMP/macdisk"
          mkdir -p "$WORK"
          git clone -q --depth 1 https://github.com/Droid-VM/macOS-DroidVM "$WORK/dvm"

          # 1. Inventory IPSW and fetch only StaticTrustCache, Cryptex1,AppOS, Cryptex1,SystemOS, and OS via HTTP Range
          pushd "$WORK/dvm"
          python3 scripts/macos-inputs.py --profile configs/macos-27.2-26B8125.json --output inv
          for COMP in StaticTrustCache "Cryptex1,AppOS" "Cryptex1,SystemOS" OS; do
            python3 scripts/macos-fetch-member.py "$COMP" \
              --profile configs/macos-27.2-26B8125.json \
              --inventory inv/identities.json \
              --identity k114sap \
              --output-dir raw \
              --jobs 8
          done
          popd
          mv "$WORK/dvm/raw" "$WORK/raw"

          # 2. Extract raw static trustcache module for xnu.ko trustcache=
          python3 - "$WORK/raw"/*.dmg.aea.trustcache "$WORK/trustcache-mac.bin" <<'PY'
          import struct, sys, glob
          paths = glob.glob(sys.argv[1])
          d = open(paths[0], 'rb').read()
          i = d.find(b'trst')
          if i < 0:
              # IM4P without trst tag (Direct DER sequence)
              j = d.find(b'\x04', 16)
          else:
              j = d.find(b'\x04', i + 7)
          n = d[j + 1]
          if n & 0x80:
              k = n & 0x7f
              length = int.from_bytes(d[j + 2:j + 2 + k], 'big'); start = j + 2 + k
          else:
              length = n; start = j + 2
          payload = d[start:start + length]
          version, count = struct.unpack_from('<I', payload, 0)[0], struct.unpack_from('<I', payload, 20)[0]
          assert version in (1, 2), f'unexpected trustcache version {version}'
          open(sys.argv[2], 'wb').write(payload)
          print(f'trustcache v{version}: {count} entries, {len(payload)} bytes -> {sys.argv[2]}')
          PY

          # 3. Decrypt AEA-encrypted SystemOS and OS DMGs using ipsw
          decrypt_aea() {
            local enc="$1" out="$2"
            local key
            key=$(ipsw fw aea --key "$enc" | awk '{print $NF}')
            mkdir -p "$WORK/aea-tmp"
            ipsw fw aea -b "$key" -o "$WORK/aea-tmp" "$enc"
            mv "$WORK/aea-tmp"/* "$out"
            rmdir "$WORK/aea-tmp"
            rm -f "$enc"
          }
          SYSOS_AEA=$(ls "$WORK/raw"/141-64957-*.dmg.aea)
          OS_AEA=$(ls "$WORK/raw"/141-64992-*.dmg.aea)
          APPOS_DMG=$(ls "$WORK/raw"/141-64745-*.dmg)

          decrypt_aea "$SYSOS_AEA" "$WORK/raw/systemos.dmg"
          decrypt_aea "$OS_AEA" "$WORK/apfs.raw"
          df -h "$WORK"

          # 4. In macOS 27.2 IPSW, the decrypted OS member (141-64992-076.dmg) is ALREADY a bare APFS container (NXSB at offset 32)
          #    whose only volume is the System volume ("Macintosh HD", role S, with native firmlinks). Grow it to DISK_GB and add
          #    Data (grouped with System), Preboot, VM, Update, Hardware, and xART roles offline via apfs-add-volumes.py.
          #    (If a future IPSW packages it as UDIF or GPT, handle that transparently too.)
          python3 - "$WORK/apfs.raw" <<'PY'
          import os, struct, subprocess, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              head = f.read(1024)
          if head[32:36] == b'NXSB':
              print(f'{path} is already a bare APFS container ({os.path.getsize(path) >> 20} MiB)')
          elif head[512:520] == b'EFI PART':
              print(f'{path} is a GPT disk image; extracting APFS container partition...')
              entries_lba, count, stride = struct.unpack_from('<QII', head, 512 + 72)
              with open(path, 'rb') as f:
                  f.seek(entries_lba * 512)
                  entries = f.read(count * stride)
              for i in range(count):
                  e = entries[i * stride:(i + 1) * stride]
                  if e[:16] == bytes(16):
                      continue
                  first_lba, last_lba = struct.unpack_from('<QQ', e, 32)
                  with open(path, 'rb') as f:
                      f.seek(first_lba * 512 + 32)
                      if f.read(4) == b'NXSB':
                          tmp = path + '.part'
                          subprocess.run(['dd', f'if={path}', f'of={tmp}', 'bs=1m',
                              f'skip={first_lba * 512}', f'count={(last_lba - first_lba + 1) * 512}',
                              'iflag=skip_bytes,count_bytes', 'conv=sparse'], check=True)
                          os.replace(tmp, path)
                          break
          else:
              raise SystemExit(f'Unsupported OS image header: {head[:64].hex()}')
          PY

          # Build mkapfs on macOS. apfsprogs includes Linux-only <linux/types.h> (__u8/__le16/__be32...) and
          # <linux/fs.h> (BLKGETSIZE64), so provide minimal compat headers. BLKGETSIZE64 is only used for block
          # devices; here mkapfs always operates on a regular image file (size comes from fstat st_size).
          git clone -q https://github.com/linux-apfs/apfsprogs.git "$WORK/dvm/sources/apfsprogs"
          git -C "$WORK/dvm/sources/apfsprogs" checkout -q 1bd1c1c2140d13d1b6d2e03379316572bee70aa3
          COMPAT="$WORK/apfs-compat"
          mkdir -p "$COMPAT/linux"
          cat > "$COMPAT/linux/types.h" <<'EOF'
          #ifndef _COMPAT_LINUX_TYPES_H
          #define _COMPAT_LINUX_TYPES_H
          #include <stdint.h>
          typedef uint8_t  __u8;  typedef int8_t  __s8;
          typedef uint16_t __u16; typedef int16_t __s16;
          typedef uint32_t __u32; typedef int32_t __s32;
          typedef uint64_t __u64; typedef int64_t __s64;
          typedef __u16 __le16; typedef __u16 __be16;
          typedef __u32 __le32; typedef __u32 __be32;
          typedef __u64 __le64; typedef __u64 __be64;
          #endif
          EOF
          cat > "$COMPAT/linux/fs.h" <<'EOF'
          #ifndef _COMPAT_LINUX_FS_H
          #define _COMPAT_LINUX_FS_H
          #include <stdint.h>
          #include <sys/ioctl.h>
          #define BLKGETSIZE64 _IOR(0x12, 114, uint64_t)
          #endif
          EOF
          # mkapfs reads random UUIDs from Linux-only /proc/sys/kernel/random/uuid (always, for the container UUID even with -u);
          # on macOS generate an RFC 4122 v4 UUID with arc4random_buf instead.
          python3 - "$WORK/dvm/sources/apfsprogs/mkapfs/mkapfs.c" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          anchor = '\t/* Linux provides randomly generated UUIDs at /proc */\n'
          assert anchor in s, 'get_random_uuid anchor not found'
          s = s.replace(anchor, (
              '#ifdef __APPLE__\n'
              '\t{\n'
              '\t\tunsigned char b[16];\n'
              '\t\tarc4random_buf(b, sizeof(b));\n'
              '\t\tb[6] = (b[6] & 0x0f) | 0x40;\n'
              '\t\tb[8] = (b[8] & 0x3f) | 0x80;\n'
              '\t\tsnprintf(uuid, 37, "%02x%02x%02x%02x-%02x%02x-%02x%02x-%02x%02x-%02x%02x%02x%02x%02x%02x",\n'
              '\t\t\t b[0], b[1], b[2], b[3], b[4], b[5], b[6], b[7], b[8], b[9], b[10], b[11], b[12], b[13], b[14], b[15]);\n'
              '\t\t(void)ret;\n'
              '\t\treturn uuid;\n'
              '\t}\n'
              '#endif\n' + anchor), 1)
          p.write_text(s)
          PY
          make -C "$WORK/dvm/sources/apfsprogs/mkapfs" CC=/usr/bin/clang CFLAGS="-O2 -Wall -I$COMPAT"
          ls -l "$WORK/dvm/sources/apfsprogs/mkapfs/mkapfs"

          # grow-data-store.py (imported by apfs-add-volumes.py) does a top-level `import packed_ramdisk` from the
          # UniXNU/DarwinBoot submodule, which the shallow DroidVM clone lacks. Fetch just that stdlib-only file at the
          # DarwinBoot commit pinned by UniXNU b2242fe (configs/env.lock.json).
          PR_DIR="$WORK/dvm/sources/UniXNU/drivers/DarwinBoot/Test"
          mkdir -p "$PR_DIR"
          curl -fsSL https://raw.githubusercontent.com/UniXNU/DarwinBoot/85332b317ee80898fc78939ea64e6ca52d3837a3/Test/packed_ramdisk.py \
            -o "$PR_DIR/packed_ramdisk.py"

          # Patch apfs-add-volumes.py on macOS so it runs under sudo directly without Linux 'unshare -r'
          python3 - "$WORK/dvm/scripts/apfs-add-volumes.py" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          p.write_text(p.read_text().replace("['unshare', '-r', str(MKAPFS),", "[str(MKAPFS),"))
          PY

          GROW_BYTES=$(python3 -c "print((int('$DISK_GB') * 1024 * 1024 * 1024) - (64 * 1024 * 1024))")
          sudo python3 "$WORK/dvm/scripts/apfs-add-volumes.py" info "$WORK/apfs.raw"
          # grow_container() mmaps the file at its current size and writes the grown space manager / chunks past the old end,
          # so the file must already be (sparsely) extended to the target size (grow-data-store.py: "truncate it first").
          python3 -c "import os,sys; os.truncate(sys.argv[1], int(sys.argv[2]))" "$WORK/apfs.raw" "$GROW_BYTES"
          ls -lh "$WORK/apfs.raw"
          sudo python3 "$WORK/dvm/scripts/apfs-add-volumes.py" add "$WORK/apfs.raw" \
            --grow-to "$GROW_BYTES" \
            --group-with 0 \
            Data:D Preboot:B VM:V Update:E Hardware:H xART:X
          sudo python3 "$WORK/dvm/scripts/apfs-add-volumes.py" info "$WORK/apfs.raw"

          # Wrap the grown APFS container inside a GPT disk image ($IMG) with partition 1 at 1 MiB (LBA 2048)
          IMG="$WORK/mac.img"
          rm -f "$IMG"
          python3 - "$IMG" "$DISK_GB" "$GROW_BYTES" <<'PY'
          import os, struct, uuid, zlib, sys
          img_path, disk_gb, part_bytes = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          total_bytes = disk_gb * 1024 * 1024 * 1024
          total_lbas = total_bytes // 512
          part_start_lba = 2048
          part_end_lba = part_start_lba + (part_bytes // 512) - 1
          fd = os.open(img_path, os.O_CREAT | os.O_TRUNC | os.O_WRONLY, 0o644)
          os.ftruncate(fd, total_bytes)
          # Protective MBR at LBA 0
          mbr = bytearray(512)
          mbr[446:446+16] = struct.pack('<BBBBBBBBII', 0, 0, 2, 0, 0xEE, 0xFF, 0xFF, 0xFF, 1, min(total_lbas - 1, 0xFFFFFFFF))
          mbr[510:512] = b'\x55\xAA'
          os.pwrite(fd, mbr, 0)
          # GPT Partition Entry 0: Apple_APFS_ISC (69646961-6700-11AA-AA11-00306543ECAC)
          apfs_isc_guid = uuid.UUID('69646961-6700-11AA-AA11-00306543ECAC').bytes_le
          unique_guid = uuid.uuid4().bytes_le
          name_utf16 = 'Apple_APFS_ISC'.encode('utf-16le').ljust(72, b'\x00')
          entry0 = struct.pack('<16s16sQQQ72s', apfs_isc_guid, unique_guid, part_start_lba, part_end_lba, 0, name_utf16)
          entries = entry0 + bytes(127 * 128)
          entries_crc = zlib.crc32(entries) & 0xFFFFFFFF
          disk_guid = uuid.uuid4().bytes_le
          def make_gpt_hdr(my_lba, alt_lba, entries_lba):
              hdr = bytearray(92)
              struct.pack_into('<8sIIIIQQQQ16sQIII', hdr, 0,
                  b'EFI PART', 0x00010000, 92, 0, 0,
                  my_lba, alt_lba, 34, total_lbas - 34,
                  disk_guid, entries_lba, 128, 128, entries_crc)
              crc = zlib.crc32(hdr) & 0xFFFFFFFF
              struct.pack_into('<I', hdr, 16, crc)
              return bytes(hdr).ljust(512, b'\x00')
          os.pwrite(fd, make_gpt_hdr(1, total_lbas - 1, 2), 512)
          os.pwrite(fd, entries, 2 * 512)
          os.pwrite(fd, entries, (total_lbas - 33) * 512)
          os.pwrite(fd, make_gpt_hdr(total_lbas - 1, 1, total_lbas - 33), (total_lbas - 1) * 512)
          os.close(fd)
          PY
          dd if="$WORK/apfs.raw" of="$IMG" bs=1m seek=1 conv=notrunc,sparse
          rm -f "$WORK/apfs.raw"

          DEV=$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nomount "$IMG" | awk 'NR==1{print $1}')
          sleep 3
          diskutil list "$DEV"
          APFS_CONT=$(diskutil list "$DEV" | awk '/Apple_APFS/{for(i=1;i<=NF;i++) if($i=="Container" && $(i+1)~ /^disk[0-9]+$/) {print $(i+1); exit}}')
          if [ -z "$APFS_CONT" ]; then
            PHYS_STORE="$(basename "$DEV")s1"
            APFS_CONT=$(diskutil apfs list | awk -v ps="$PHYS_STORE" '
              /Container Reference:/ { c=$NF }
              /APFS Physical Store/ && $0 ~ ps { print c; exit }
            ')
          fi
          # Resolve volume device nodes by APFS role from `diskutil apfs list -plist` (text scraping of `diskutil list`
          # is fragile, esp. for an Apple_APFS_ISC container); retry while diskarbitrationd is still probing the volumes.
          find_vols() {
            diskutil apfs list -plist "$APFS_CONT" 2>/dev/null | python3 -c '
          import plistlib, sys
          try:
              d = plistlib.loads(sys.stdin.buffer.read())
          except Exception:
              sys.exit(0)
          found = {}
          for c in d.get("Containers", []):
              for v in c.get("Volumes", []):
                  for r in v.get("Roles", []):
                      found.setdefault(r, v.get("DeviceIdentifier", ""))
          print(found.get("System", ""), found.get("Data", ""), found.get("Preboot", ""))
          '
          }
          SYS_DEV=; DATA_DEV=; PRE_DEV=
          for i in $(seq 1 30); do
            read -r SYS_DEV DATA_DEV PRE_DEV < <(find_vols) || true
            [ -n "$SYS_DEV" ] && [ -n "$DATA_DEV" ] && [ -n "$PRE_DEV" ] && break
            sleep 2
          done
          echo "APFS volumes on $APFS_CONT: System=$SYS_DEV Data=$DATA_DEV Preboot=$PRE_DEV"
          if [ -z "$SYS_DEV" ] || [ -z "$DATA_DEV" ] || [ -z "$PRE_DEV" ]; then
            diskutil list "$DEV" || true
            diskutil apfs list "$APFS_CONT" || true
            echo "::error::could not resolve System/Data/Preboot volumes on $APFS_CONT"
            exit 1
          fi
          diskutil unmountDisk "$APFS_CONT" >/dev/null 2>&1 || true

          mkdir -p "$WORK/mnt/sys" "$WORK/mnt/data" "$WORK/mnt/preboot" "$WORK/mnt/sysos_src" "$WORK/mnt/appos_src"
          sudo mount -t apfs -o rw,nobrowse "/dev/$SYS_DEV" "$WORK/mnt/sys"
          sudo diskutil mount -mountPoint "$WORK/mnt/data" "$DATA_DEV"
          sudo diskutil enableOwnership "$WORK/mnt/data"
          sudo diskutil mount -mountPoint "$WORK/mnt/preboot" "$PRE_DEV"
          sudo diskutil enableOwnership "$WORK/mnt/preboot"

          echo "Merging Cryptex1,SystemOS into System volume and Preboot..."
          hdiutil attach -readonly -nobrowse -mountpoint "$WORK/mnt/sysos_src" "$WORK/raw/systemos.dmg"
          for d in usr/lib usr/libexec usr/bin usr/sbin usr/share System/iOSSupport; do
            [ -d "$WORK/mnt/sysos_src/$d" ] && sudo mkdir -p "$WORK/mnt/sys/$d" && sudo cp -Rpn "$WORK/mnt/sysos_src/$d/." "$WORK/mnt/sys/$d/" 2>/dev/null || true
          done
          for e in "$WORK/mnt/sysos_src"/System/Library/*; do
            n=$(basename "$e")
            if [ -d "$e" ]; then
              sudo mkdir -p "$WORK/mnt/sys/System/Library/$n"
              sudo cp -Rpn "$e/." "$WORK/mnt/sys/System/Library/$n/" 2>/dev/null || true
            else
              sudo cp -pn "$e" "$WORK/mnt/sys/System/Library/" 2>/dev/null || true
            fi
          done
          sudo mkdir -p "$WORK/mnt/preboot/Cryptexes" "$WORK/mnt/preboot/com.apple.security.cryptexd/Cryptexes"
          sudo ln -sfn / "$WORK/mnt/preboot/Cryptexes/OS"
          sudo mkdir -p "$WORK/mnt/sys/System/Volumes/Preboot/Cryptexes" "$WORK/mnt/sys/System/Volumes/Preboot/com.apple.security.cryptexd/Cryptexes"
          sudo ln -sfn / "$WORK/mnt/sys/System/Volumes/Preboot/Cryptexes/OS"
          hdiutil detach "$WORK/mnt/sysos_src" -force
          rm -f "$WORK/raw/systemos.dmg"

          echo "Copying Cryptex1,AppOS into Preboot/Cryptexes/App..."
          hdiutil attach -readonly -nobrowse -mountpoint "$WORK/mnt/appos_src" "$APPOS_DMG"
          sudo mkdir -p "$WORK/mnt/preboot/Cryptexes/App"
          sudo ditto "$WORK/mnt/appos_src" "$WORK/mnt/preboot/Cryptexes/App"
          hdiutil detach "$WORK/mnt/appos_src" -force
          rm -f "$APPOS_DMG"

          # 5. Populate Data volume from System's Data template + gui-user.py + XnuCpuMetal.bundle + launchd jobs
          echo "Populating Data volume..."
          D="$WORK/mnt/data"
          sudo ditto "$WORK/mnt/sys/System/Library/Templates/Data" "$D"
          for dir in tmp log run vm folders db/dslocal/nodes/Default; do
            sudo mkdir -p "$D/private/var/$dir"
          done
          sudo mkdir -p "$D/private/tmp"
          sudo chmod 1777 "$D/private/var/tmp" "$D/private/tmp"
          sudo rm -f "$D"/private/var/keybags/* 2>/dev/null || true

          sudo python3 tools/hosted/gui-user.py "$D" "$WORK/mnt/sys/System/Library/User Template"
          sudo mkdir -p "$D/Library/GPUBundles" "$D/Library/LaunchDaemons" "$D/private/var/db/com.apple.xpc.launchd"
          if [ -d "gpu/xnu-cpu-metal/dist/XnuCpuMetal.bundle" ]; then
            sudo ditto "gpu/xnu-cpu-metal/dist/XnuCpuMetal.bundle" "$D/Library/GPUBundles/XnuCpuMetal.bundle"
            sudo chown -R root:wheel "$D/Library/GPUBundles"
          fi

          DISABLE="com.apple.watchdogd com.apple.iomfb_bics_daemon com.apple.audiomxd com.apple.audio.coreaudiod com.apple.PerfPowerServices com.apple.PerfPowerServicesExtended com.apple.oahd com.apple.oahd-root-helper com.apple.apsd com.apple.AppSSODaemon com.apple.filesystems.fskitd com.apple.fairplayd"
          sudo D="$D" DISABLE="$DISABLE" python3 - <<'PY'
          import os, plistlib
          D = os.environ["D"]
          shell = {"Label": "xnulinux.shell", "ProgramArguments": ["/bin/bash", "-i"], "RunAtLoad": True,
                   "StandardInPath": "/dev/console", "StandardOutPath": "/dev/console", "StandardErrorPath": "/dev/console",
                   "EnvironmentVariables": {"HOME": "/var/root", "LOGNAME": "root", "USER": "root", "SHELL": "/bin/bash", "TERM": "dumb",
                                            "PATH": "/bin:/usr/bin:/sbin:/usr/sbin", "PS1": "xnulinux# "}}
          p = D + "/Library/LaunchDaemons/xnulinux.shell.plist"
          plistlib.dump(shell, open(p, "wb")); os.chown(p, 0, 0); os.chmod(p, 0o644)
          awake = {"Label": "xnulinux.awake", "RunAtLoad": True,
                   "ProgramArguments": ["/usr/bin/pmset", "-a", "displaysleep", "0", "sleep", "0", "disksleep", "0"]}
          p = D + "/Library/LaunchDaemons/xnulinux.awake.plist"
          plistlib.dump(awake, open(p, "wb")); os.chown(p, 0, 0); os.chmod(p, 0o644)
          nosaver = {"Label": "xnulinux.nosaver", "RunAtLoad": True, "LimitLoadToSessionType": "Aqua",
                     "ProgramArguments": ["/usr/bin/defaults", "-currentHost", "write", "com.apple.screensaver", "idleTime", "-int", "0"]}
          os.makedirs(D + "/Library/LaunchAgents", exist_ok=True)
          p = D + "/Library/LaunchAgents/xnulinux.nosaver.plist"
          plistlib.dump(nosaver, open(p, "wb")); os.chown(p, 0, 0); os.chmod(p, 0o644)
          p = D + "/private/var/db/com.apple.xpc.launchd/disabled.plist"
          disabled = plistlib.load(open(p, "rb")) if os.path.exists(p) else {}
          disabled.update({label: True for label in os.environ["DISABLE"].split()})
          plistlib.dump(disabled, open(p, "wb")); os.chown(p, 0, 0); os.chmod(p, 0o644)
          os.makedirs(D + "/Library/Preferences", exist_ok=True)
          p = D + "/Library/Preferences/com.apple.keyboardtype.plist"
          plistlib.dump({"keyboardtype": {"22529-4617-0": 40}}, open(p, "wb")); os.chown(p, 0, 0); os.chmod(p, 0o644)
          os.makedirs(D + "/private/etc", exist_ok=True)
          p = D + "/private/etc/sysctl.conf"
          open(p, "w").write("kern.memorystatus_highwater_enabled=0\n"); os.chown(p, 0, 0); os.chmod(p, 0o644)
          PY

          ROOT_UUID=$(diskutil info "$SYS_DEV" | awk -F': *' '/Volume UUID/{print $2; exit}')
          GROUP_UUID=$(diskutil info "$DATA_DEV" | awk -F': *' '/Volume UUID/{print $2; exit}')
          sudo mkdir -p "$WORK/mnt/preboot/$GROUP_UUID"
          {
            echo "ROOT_UUID=$ROOT_UUID"
            echo "BOOT_UUID=$GROUP_UUID"
            echo "MACOS=27.2"
          } > "$WORK/mac.conf"
          cat "$WORK/mac.conf"

          sync
          sudo umount "$WORK/mnt/sys"
          sudo diskutil unmount force "$WORK/mnt/data"
          sudo diskutil unmount force "$WORK/mnt/preboot"
          hdiutil detach "$DEV" -force

          # 6. Compress sparse mac.img with zstd --sparse
          mkdir -p artifacts
          cp "$WORK/mac.conf" "$WORK/trustcache-mac.bin" artifacts/
          if [ -d "gpu/xnu-cpu-metal/dist/XnuCpuMetal.bundle" ]; then
            tar -C gpu/xnu-cpu-metal/dist -czf artifacts/XnuCpuMetal.bundle.tar.gz XnuCpuMetal.bundle
          fi
          zstd -T0 -3 --sparse "$IMG" -o artifacts/mac.img.zst
          rm -f "$IMG"
          ls -lh artifacts/

      - name: Stage GPU bundle artifact (when build_disk is false)
        if: ${{ inputs.build_gpu_bundle && !inputs.build_disk }}
        run: |
          mkdir -p artifacts
          tar -C gpu/xnu-cpu-metal/dist -czf artifacts/XnuCpuMetal.bundle.tar.gz XnuCpuMetal.bundle
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: xnulinux-macos27-assets
          path: artifacts/*
          compression-level: 0
          retention-days: 7

      - name: Publish to GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macos-27.2-latest"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "xnulinux macOS 27.2 (26B8125) Latest Build" \
              --notes $'Automated macOS 27.2 (26B8125) APFS disk & GPU bundle build.\n\nReassemble `mac.img` on the Linux host:\n```sh\ncat mac.img.zst.part-* | zstd -d --sparse -o /var/tmp/mac.img\ncp mac.conf /var/tmp/mac.conf\nsudo cp trustcache-mac.bin /lib/firmware/xnu/trustcache-mac.bin\n```' \
              --prerelease || true
          fi
          mkdir -p release-assets
          for f in artifacts/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" = "mac.img.zst" ]; then
              split -b 1900m "$f" "release-assets/mac.img.zst.part-"
            else
              cp "$f" "release-assets/$base"
            fi
          done
          if ls release-assets/mac.img.zst.part-* >/dev/null 2>&1; then
            for old_asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(startswith("mac.img.zst.part-"))' || true); do
              gh release delete-asset "$TAG" "$old_asset" --repo "$GITHUB_REPOSITORY" --yes || true
            done
          fi
          ls -lh release-assets/
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          rm -rf release-assets

  kernel-and-kc:
    if: ${{ inputs.build_kernel }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Free disk space and prepare /mnt workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo mkdir -p /mnt/w && sudo chown "$(id -u):$(id -g)" /mnt/w
          ln -sfn /mnt/w "$HOME/w"
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Fetch IPSW KernelCache and TrustCache via macOS-DroidVM
        run: |
          W="$HOME/w" bash scripts/vm-xnu-build.sh
          cd "$HOME/w/dvm"
          mkdir -p toolchains/ipsw
          curl -sSL https://github.com/blacktop/ipsw/releases/download/v3.1.749/ipsw_3.1.749_linux_arm64.tar.gz | tar -C toolchains/ipsw -xzf - ipsw
          chmod +x toolchains/ipsw/ipsw
          export IPSW="$PWD/toolchains/ipsw/ipsw"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('configs/product-k27.json')
          cfg = json.loads(p.read_text())
          for src in cfg['inputs']['ipsws']:
              src['members'] = [m for m in src['members'] if 'TrustCache' in m['component'] or m['component'] in ('KernelCache', 'DeviceTree')]
          p.write_text(json.dumps(cfg, indent=1))
          PY
          python3 scripts/product.py inputs
          ls -lh out/kc/kc27.bin artifacts/27.2/boot/kernel.macho.trustcache

      - name: Apply LINUX64 patches and build kc.bin + kernel.macho
        run: |
          sudo mkdir -p /lib/firmware/xnu
          W="$HOME/w" bash scripts/vm-xnu-rebuild.sh
          python3 - <<'PY'
          import struct, pathlib
          tc_bundle = pathlib.Path.home() / 'w/dvm/artifacts/27.2/boot/kernel.macho.trustcache'
          data = tc_bundle.read_bytes()
          count, off0 = struct.unpack_from('<II', data, 0)
          off1 = struct.unpack_from('<I', data, 8)[0] if count > 1 else len(data)
          mod0 = data[off0:off1]
          pathlib.Path('/tmp/trustcache-mac.bin').write_bytes(mod0)
          print(f'Extracted raw trustcache module: {len(mod0)} bytes')
          PY
          mkdir -p /mnt/w/out-artifacts
          cp /home/runner/w/dvm/out/k27/kernel-k27.macho /mnt/w/out-artifacts/kernel.macho
          cp /home/runner/w/dvm/out/k27/kc-k27.bin /mnt/w/out-artifacts/kc.bin
          cp /tmp/trustcache-mac.bin /mnt/w/out-artifacts/
          ls -lh /mnt/w/out-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: xnulinux-firmware-arm64
          path: /mnt/w/out-artifacts/*
          retention-days: 14
